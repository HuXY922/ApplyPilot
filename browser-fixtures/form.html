<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>投递执行器测试表单</title><style>body{font:16px system-ui;max-width:600px;margin:60px auto;padding:25px;color:#183250}label{display:block;margin:22px 0 6px}input,select,button{font:inherit;padding:10px;width:100%;box-sizing:border-box}button{margin-top:25px}#receipt{padding:20px;background:#e5f4ed;margin-top:20px}</style><h1>浏览器填写验证</h1><p>隔离测试页面，仅使用虚构信息。此表单不会发送任何网络请求。</p><form id="fixture"><label for="name">测试姓名</label><input id="name" required><label for="email">测试邮箱</label><input id="email" type="email" required><label for="city">期望城市</label><select id="city" required><option value="">请选择</option><option value="guangzhou">广州</option><option value="shanghai">上海</option></select><button type="submit">验证测试表单</button></form><div id="receipt" role="status" hidden>测试表单校验成功；没有产生真实投递。</div><script>document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#receipt').hidden=false})</script></html>
