<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋招手账 · CAREER DESK</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<aside class="sidebar"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><div><strong>秋招手账</strong><small>CAREER DESK</small></div></div><div class="season">2026 秋季招聘 <span>进行中</span></div><nav aria-label="主导航"><button data-view="overview"><span>▦</span>总览</button><button data-view="today"><span>▢</span>岗位与投递</button><button data-view="attention"><span>▤</span>待我处理</button><button data-view="messages"><span>▱</span>招聘回音</button><button data-view="profile"><span>▧</span>求职档案</button></nav><div class="directions"><small>我的求职路线</small><div id="directions">连接后查看求职方向</div><small>方向来自已整理的求职偏好</small></div><div class="sidebar-bottom"><div class="schedule">◷ 每天 08:00 岗位晨报<small>等待接入 · 尚未启用</small></div><div class="account"><span class="avatar">湘</span><div>我的求职工作台<small>本地访问</small></div></div></div></aside>
<div class="workspace"><header class="topbar"><div>我的工作台 <span>›</span> <b id="breadcrumb">总览</b></div><div><span id="clock"></span><span class="avatar">湘</span></div></header><main><div class="page-heading"><div><p class="eyebrow">一步一步，走向下一站</p><h1 id="title">秋招进度，一目了然。</h1><p id="subtitle">先看合适的机会，再把每一次投递照顾好。</p></div><button id="refresh" class="primary">↻ 刷新岗位</button></div>
<form id="login" class="panel login"><label for="token">连接你的工作台</label><input id="token" type="password" placeholder="输入本地用户访问密钥" required autocomplete="off"><button class="primary">连接</button><small>仅在当前页面使用，刷新后需重新连接。</small></form>
<section id="controls" hidden><div class="mode-switch" aria-label="投递模式"><button data-mode="simulation">▷ 模拟演练</button><button data-mode="live" class="selected">▢ 真实投递</button></div><div class="filters"><label>批次 <select id="campaign"></select></label><label>Radar 日期 <input id="date" type="date"></label><button id="logout" class="text-button">断开</button></div></section>
<div id="notice" class="notice"><strong>连接真实数据</strong><span>岗位、推荐和审批记录将从本地工作台读取。</span></div><p id="message" role="status" class="status-message"></p>
<section id="counts" class="stats"></section><div id="layout"><section id="content" class="panel"></section><aside id="context"></aside></div><section id="activity" class="panel activity" hidden></section><footer><span>秋招手账</span><span>让下一步，更清楚一点。</span></footer></main></div>
<dialog id="detail" aria-labelledby="detail-title"><div class="drawer-head"><button id="close-detail" class="close" aria-label="关闭详情">×</button><p class="eyebrow">这次投递的详情</p><h2 id="detail-title">岗位详情</h2><p id="detail-subtitle"></p></div><div id="detail-body"></div></dialog></body></html>
